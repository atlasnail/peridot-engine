name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # clang-format and clang-tidy are installed from PyPI at this exact version so
  # CI and local runs analyse and format with the same tools. Bump both together
  # with the configs, and re-run the format check.
  LLVM_TOOLS_VERSION: "22.1.8"

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: python -m pip install "clang-format==$env:LLVM_TOOLS_VERSION"

      - name: Check formatting
        run: python tools/check_format.py

      - name: Configure (Debug)
        run: bash tools/dev/ci_configure.sh windows-debug

      - name: Build (Debug)
        run: bash tools/dev/ci_build.sh windows-debug

      - name: Test (Debug)
        run: ctest --preset windows-debug

      - name: Configure (Release)
        run: bash tools/dev/ci_configure.sh windows-release

      - name: Build (Release)
        run: bash tools/dev/ci_build.sh windows-release

      - name: Test (Release)
        run: ctest --preset windows-release

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    env:
      # Regular window tests use SDL's dummy video backend; the GL step overrides it.
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and SDL build dependencies
        run: |
          # Isolate Ubuntu sources so exact pins cannot fall back to a live archive.
          printf '%s\n' \
            'Types: deb' 'URIs: http://archive.ubuntu.com/ubuntu' \
            'Suites: noble noble-updates' 'Components: main universe restricted multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' 'Snapshot: enable' '' \
            'Types: deb' 'URIs: http://security.ubuntu.com/ubuntu' \
            'Suites: noble-security' 'Components: main universe restricted multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' 'Snapshot: enable' \
            > "$RUNNER_TEMP/ubuntu-snapshot.sources"
          apt_snapshot=(--snapshot 20261122T210000Z
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ubuntu-snapshot.sources"
            -o 'Dir::Etc::sourceparts=-')
          sudo apt-get "${apt_snapshot[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_snapshot[@]}" install -y --allow-downgrades ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libdecor-0-dev \
            libdrm-dev libgbm-dev=25.2.8-0ubuntu0.24.04.5 libudev-dev \
            libgl-dev=1.7.0-1build1 libglx-dev=1.7.0-1build1 \
            libgl1-mesa-dri=25.2.8-0ubuntu0.24.04.5 \
            libglx-mesa0=25.2.8-0ubuntu0.24.04.5 \
            xvfb=2:21.1.12-1ubuntu1.9 xserver-common=2:21.1.12-1ubuntu1.9 \
            xauth=1:1.1.2-1build1 mesa-utils=9.0.0-2 mesa-utils-bin=9.0.0-2
          python -m pip install \
            "clang-format==${LLVM_TOOLS_VERSION}" \
            "clang-tidy==${LLVM_TOOLS_VERSION}"

      - name: Check formatting
        run: python tools/check_format.py

      - name: Configure (Debug)
        run: bash tools/dev/ci_configure.sh linux-debug

      - name: Build (Debug)
        run: bash tools/dev/ci_build.sh linux-debug

      - name: Test (Debug)
        run: ctest --preset linux-debug

      - name: Test OpenGL (Xvfb + Mesa llvmpipe)
        env:
          SDL_VIDEODRIVER: x11
          PERI_TEST_OPENGL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -euo pipefail -c '
            glxinfo -B | tee /dev/stderr | grep -i "OpenGL renderer string:.*llvmpipe"
            for test in window_opengl_context_smoke window_opengl_validation_failure_cleans_up; do
              build/linux-debug/bin/peri_platform_tests "$test" | tee /dev/stderr | grep -Fx "ok    $test"
            done
          '

      - name: Configure (ASan + UBSan)
        run: bash tools/dev/ci_configure.sh linux-asan

      - name: Build (ASan + UBSan)
        run: bash tools/dev/ci_build.sh linux-asan

      - name: Test (ASan + UBSan)
        run: ctest --preset linux-asan

      - name: Configure (Release)
        run: bash tools/dev/ci_configure.sh linux-release

      - name: Build (Release)
        run: bash tools/dev/ci_build.sh linux-release

      - name: Test (Release)
        run: ctest --preset linux-release

      # Blocking: engine sources must be clean under the project's check set.
      # Uses the pinned clang-tidy above, so local and CI findings match.
      - name: Static analysis (blocking)
        run: bash tools/dev/ci_clang_tidy.sh build/linux-debug
